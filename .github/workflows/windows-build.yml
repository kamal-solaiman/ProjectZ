name: Windows build and publish
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static checks
        run: python tools/static_checks.py
      - name: Security tests
        run: dotnet run --project tests/ProjectZ.Security.Tests -c Release
      - name: Appearance tests
        shell: pwsh
        run: |
          dotnet run --project tests/ProjectZ.Appearance.Tests -c Release 2>&1 |
            Tee-Object -FilePath appearance-tests.log
          if ($LASTEXITCODE -ne 0) {
            $text = (Get-Content appearance-tests.log -Raw)
            $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Appearance tests::$escaped"
            exit $LASTEXITCODE
          }
      - name: Build WPF
        run: dotnet build ProjectZ.sln -c Release
      - name: Publish self-contained x64
        run: dotnet publish src/ProjectZ/ProjectZ.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish/win-x64
      - name: Verify external configuration
        shell: pwsh
        run: |
          if (!(Test-Path publish/win-x64/ProjectZ.exe)) { throw 'EXE missing' }
          if (!(Test-Path publish/win-x64/connectionsettings.json)) { throw 'Settings missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectZ-win-x64
          path: publish/win-x64/
          if-no-files-found: error

  purchase-sql:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Purchase repository against disposable SQL Server LocalDB
        shell: pwsh
        run: |
          ./tests/ProjectZ.Purchase.Sql.Tests/Run.ps1 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'purchase-sql.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Surface SQL failure details
        if: failure()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'purchase-sql.log'
          if (Test-Path $path) {
            $text = Get-Content $path -Raw
            $text = $text.Substring([Math]::Max(0, $text.Length - 12000))
            $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Purchase SQL integration::$escaped"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "``````text`n$text`n``````"
          }
